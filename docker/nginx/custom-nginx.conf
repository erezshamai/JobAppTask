server {
    listen 80;

    # Map the X-Forwarded-For header to a variable
    map $http_x_forwarded_for $forwarded_for {
        default $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://web:50001;

        # Preserve original Host header
        proxy_set_header Host $host;

        # Forward real client IP
        proxy_set_header X-Real-IP $remote_addr;

        # Add the full chain of client IPs
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Keep the scheme (http/https)
        proxy_set_header X-Forwarded-Proto $scheme;

        # Add X-Forwarded-For to response headers
        add_header X-Forwarded-For $forwarded_for always;
    }
}