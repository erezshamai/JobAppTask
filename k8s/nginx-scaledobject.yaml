apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: nginx-scaledobject
spec:
  scaleTargetRef:
    name: nginx-deployment  # References your deployment
  minReplicaCount: 1
  maxReplicaCount: 3
  pollingInterval: 10  # Check every 10 seconds
  cooldownPeriod: 30  
  triggers:
  - type: cpu
    metadata:
      type: Utilization  # Scale based on CPU utilization
      value: "30"  # Scale when CPU > 30%